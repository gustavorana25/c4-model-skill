# Testa o viewer e o script Python em todo PR e push; publica no GitHub Pages só no push no main.
# O build gera um único viewer/dist/index.html autocontido; os planos ficam no #hash
# do link e nunca chegam ao servidor.
name: Viewer no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um run por ref; um push novo cancela o que estiver esperando (PRs não cancelam o deploy do main)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - run: npm ci
      - run: npm test

      # depois do npm test: o teste Python lê o fixture que o viewer gera (pix.ts.hash.txt)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python3 tests/test_arch_url.py
        working-directory: .

      - run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
